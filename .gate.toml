# Gates gate cannot infer, and the flavours this project actually runs.
#
# Detection knows `cargo build`, `cargo clippy`, `cargo test`, `cargo audit`
# (vuln, when cargo-audit is installed), actionlint and shellcheck (shell, over
# any `.sh`). It cannot know that this project pins the lockfile on every one
# of them, nor that its checks include cargo-deny and cargo-machete. These
# entries say so, which makes `gate` the whole check, and lefthook runs `gate`.

# --locked fails rather than silently updating Cargo.lock, which is the whole
# point of running it in a gate.
[gates.build]
run = "cargo build --locked"

# cargo runs one integration binary at a time; fanning the targets out keeps
# every check and overlaps the live /proc suites that dominate a sequential run.
[gates.test]
run = "sh -c 'cargo test --locked --all-targets --no-run && fail=0; cargo test --locked --lib & p1=$!; cargo test --locked --test grouping & p2=$!; cargo test --locked --test live_proc & p3=$!; cargo test --locked --test reconcile & p4=$!; cargo test --locked --test tty_restore & p5=$!; cargo test --locked --bin heft & p6=$!; for p in $p1 $p2 $p3 $p4 $p5 $p6; do wait $p || fail=1; done; exit $fail'"

# --all-targets reaches tests and benches, and -D warnings is what makes
# clippy a gate rather than a report.
[gates.lint]
run = "cargo clippy --locked --all-targets -- -D warnings"

[gates.fmt]
run = "cargo fmt --check"

# Licences, bans and sources. Not a lint of this code, so it is its own gate.
[gates.deny]
run = "cargo deny --locked check bans licenses sources"

# The RustSec advisory scan, run once. Detection adds `cargo audit` as vuln
# wherever cargo-audit is installed and config cannot remove a detected gate,
# so vuln is pointed at cargo-deny's advisories check instead, which reads the
# same RustSec database under deny.toml's policy.
[gates.vuln]
run = "cargo deny --locked check advisories"

# Dependencies declared and never used.
[gates.machete]
run = "cargo machete"
