# Gates gate cannot infer, and the flavours this project actually runs.
#
# Detection knows `cargo build`, `cargo clippy`, `cargo test`, `cargo audit`
# (vuln, when cargo-audit is installed), actionlint and shellcheck (shell, over
# any `.sh`). It cannot know that this project pins the lockfile on every one
# of them, nor that its checks include cargo-deny and cargo-machete. These
# entries say so, which makes `gate` the whole check, and lefthook runs `gate`.

# --locked fails rather than silently updating Cargo.lock, which is the whole
# point of running it in a gate.
[gates.build]
run = "cargo build --locked"

# cargo runs one integration binary at a time; fanning the targets out keeps
# every check and overlaps the live /proc suites that dominate a sequential run.
[gates.test]
run = "sh -c 'fail=0; cargo test --locked --all-targets --no-run || exit 1; cargo test --locked --lib & pids=$!; for t in tests/*.rs; do cargo test --locked --test $(basename $t .rs) & pids=\"$pids $!\"; done; cargo test --locked --bin heft & pids=\"$pids $!\"; for p in $pids; do wait $p || fail=1; done; exit $fail'"

# --all-targets reaches tests and benches, and -D warnings is what makes
# clippy a gate rather than a report.
[gates.lint]
run = "cargo clippy --locked --all-targets -- -D warnings"

[gates.fmt]
run = "cargo fmt --check"

# Licences, bans and sources. Not a lint of this code, so it is its own gate.
[gates.deny]
run = "cargo deny --locked check bans licenses sources"

# The RustSec advisory scan, run once. Detection adds `cargo audit` as vuln
# wherever cargo-audit is installed and config cannot remove a detected gate,
# so vuln is pointed at cargo-deny's advisories check instead, which reads the
# same RustSec database under deny.toml's policy.
[gates.vuln]
run = "cargo deny --locked check advisories"

# Dependencies declared and never used.
[gates.machete]
run = "cargo machete"

# /proc and DRM fdinfo are architecture-neutral; check only, nothing links.
[gates.cross-check]
timeout = "5m"
run = "cargo check --locked --all-targets --target aarch64-unknown-linux-gnu"

# e2e: needs the 1.98 toolchain, which a dev machine does not carry by default.
[gates.msrv]
e2e = true
timeout = "10m"
run = "cargo +1.98 check --locked --all-targets"

# e2e: pulls and runs an Alpine container.
[gates.bare-container]
e2e = true
timeout = "10m"
run = '''
art=$(mktemp)
cargo test --locked --target x86_64-unknown-linux-musl --test live_proc --no-run --message-format=json > "$art"
bin=$(jq -r 'select(.target.name == "live_proc" and .executable != null) | .executable' "$art" | tail -n1)
heft=$(jq -r 'select(.target.name == "heft" and .executable != null) | .executable' "$art" | tail -n1)
test -n "$bin" && test -f "$heft"
docker run --rm --network none \
  -v "$bin:/live_proc:ro" \
  -v "$(dirname "$heft"):$(dirname "$heft"):ro" \
  alpine@sha256:294b683cb724975bec92580e1e685676bd4b50bda910ddb8c51d4cabeaec77e6 \
  /live_proc
'''
