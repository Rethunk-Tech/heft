name: Bug report
description: Something heft shows is wrong, or it crashed
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What did heft show, and what did you expect instead?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Reproduce
      description: The exact command, and the row or column that is wrong.
      placeholder: heft --once
    validations:
      required: true
  - type: textarea
    id: env
    attributes:
      label: Environment
      description: |
        `heft --version`, your distro and kernel (`uname -r`), and the GPU
        vendor if the report is about VRAM/GTT or gfx%.
    validations:
      required: true
  - type: textarea
    id: fixture
    attributes:
      label: heft --fixture output
      description: |
        For a row in the wrong place: `heft --fixture > heft-fixture.json`,
        then drag the file here. It holds the exe, cgroup, parent and command
        line of each process, which is what grouping reads and what a
        screenshot or `--json` leaves out. Read it first: command lines can
        carry tokens, and paths can identify your machine.
