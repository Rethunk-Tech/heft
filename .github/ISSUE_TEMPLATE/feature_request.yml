name: Feature request
description: Suggest a capability heft does not have
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to learn about your machine that heft cannot tell you?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What you have in mind
  - type: checkboxes
    id: scope
    attributes:
      label: Scope check
      description: heft is observe-only. See CONTRIBUTING.md.
      options:
        - label: This does not ask heft to kill, nice, ptrace, write `/proc`, or make mutating Docker/Podman calls.
          required: true
