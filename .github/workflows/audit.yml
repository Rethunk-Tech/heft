name: audit
# The per-push gate only sees the lockfile at that commit. This catches an
# advisory filed later against a dependency nothing has touched, on its own
# trigger so it never blocks an unrelated pull request.
on:
  schedule:
    - cron: "0 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  deny:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Rethunk-Tech/gh-actions/setup-rust@99dfb9093ab089d28f76d8036322a7c062259e76 # v1.13
        with:
          toolchain: stable
      - uses: cargo-bins/cargo-binstall@422f3094be6a0843857aa008b499caaf6bce0da8 # v1.24.0
        with:
          version: "1.23.0"
      - run: cargo binstall --no-confirm cargo-deny
      - run: cargo deny --locked check
