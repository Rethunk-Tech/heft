name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Rethunk-Tech/gh-actions/setup-rust@67ec8bd68343d915462729ad119c355740cf6205 # v1.22
        with:
          toolchain: stable
      # This job is `gate --list` / `.gate.toml`. fmt, clippy and test used to
      # run only in setup-rust, whose test flag is `--all-targets`, while local
      # `gate` was `cargo test --locked`. One list now, each step the command
      # that file names. `if: !cancelled()` keeps later gates reporting after
      # an earlier failure.
      - if: ${{ !cancelled() }}
        env:
          ACTIONLINT_VERSION: "1.7.12"
          ACTIONLINT_SHA256: "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"
          CARGO_DENY_VERSION: "0.20.2"
          CARGO_DENY_SHA256: "9f12ed4c49936e09b48bf862b595cde2fe64fcbd9d74dfacac6131ca824c8d5f"
          CARGO_MACHETE_VERSION: "0.9.2"
          CARGO_MACHETE_SHA256: "48200087f54c55aabcd4db4af1e25742b49846c02a1b1bfa134711945b35b2e9"
        run: |
          set -euo pipefail
          bin="$RUNNER_TEMP/bin"
          mkdir -p "$bin"
          fetch() {
            url=$1 sha=$2 dest=$3
            curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
              --output "$dest" "$url"
            echo "$sha  $dest" | sha256sum --check --strict
          }
          fetch "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" \
            "$ACTIONLINT_SHA256" "$RUNNER_TEMP/actionlint.tar.gz"
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$bin" actionlint
          tarball="cargo-deny-${CARGO_DENY_VERSION}-x86_64-unknown-linux-musl.tar.gz"
          fetch "https://github.com/EmbarkStudios/cargo-deny/releases/download/${CARGO_DENY_VERSION}/$tarball" \
            "$CARGO_DENY_SHA256" "$RUNNER_TEMP/$tarball"
          tar -xzf "$RUNNER_TEMP/$tarball" --strip-components=1 -C "$bin" \
            "cargo-deny-${CARGO_DENY_VERSION}-x86_64-unknown-linux-musl/cargo-deny"
          tarball="cargo-machete-v${CARGO_MACHETE_VERSION}-x86_64-unknown-linux-musl.tar.gz"
          fetch "https://github.com/bnjbvr/cargo-machete/releases/download/v${CARGO_MACHETE_VERSION}/$tarball" \
            "$CARGO_MACHETE_SHA256" "$RUNNER_TEMP/$tarball"
          tar -xzf "$RUNNER_TEMP/$tarball" -C "$RUNNER_TEMP"
          install -m 0755 "$(find "$RUNNER_TEMP" -type f -name cargo-machete | head -n1)" \
            "$bin/cargo-machete"
          echo "$bin" >> "$GITHUB_PATH"
      - id: fmt
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: cargo fmt --check
      - id: lint
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: cargo clippy --locked --all-targets -- -D warnings
      - id: test
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: sh -c 'cargo test --locked --all-targets --no-run && fail=0; cargo test --locked --lib & p1=$!; cargo test --locked --test grouping & p2=$!; cargo test --locked --test live_proc & p3=$!; cargo test --locked --test reconcile & p4=$!; cargo test --locked --test tty_restore & p5=$!; cargo test --locked --bin heft & p6=$!; for p in $p1 $p2 $p3 $p4 $p5 $p6; do wait $p || fail=1; done; exit $fail'
      - id: build
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: cargo build --locked
      - id: deny
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: cargo deny --locked check bans licenses sources
      - id: vuln
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: cargo deny --locked check advisories
      - id: machete
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: cargo machete
      - id: actionlint
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: actionlint .github/workflows/*.yml
      - id: shellcheck
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends shellcheck
          shellcheck packaging/aur/release.sh
      - name: Gate on every check
        if: ${{ !cancelled() }}
        env:
          OUTCOMES: |
            fmt=${{ steps.fmt.outcome }}
            lint=${{ steps.lint.outcome }}
            test=${{ steps.test.outcome }}
            build=${{ steps.build.outcome }}
            deny=${{ steps.deny.outcome }}
            vuln=${{ steps.vuln.outcome }}
            machete=${{ steps.machete.outcome }}
            actionlint=${{ steps.actionlint.outcome }}
            shellcheck=${{ steps.shellcheck.outcome }}
        run: |
          failed=0
          while IFS='=' read -r check outcome; do
            [ -z "$check" ] && continue
            echo "$check: $outcome"
            if [ "$outcome" != "success" ]; then
              failed=1
            fi
          done <<EOF
          $OUTCOMES
          EOF
          exit "$failed"

  # /proc and DRM fdinfo are architecture-neutral, so an x86 assumption is a
  # bug heft should not need an aarch64 runner to find. Check only: nothing
  # links, so no cross linker is required.
  cross-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Rethunk-Tech/gh-actions/setup-rust@67ec8bd68343d915462729ad119c355740cf6205 # v1.22
        with:
          toolchain: stable
          targets: aarch64-unknown-linux-gnu
      - run: cargo check --locked --all-targets --target aarch64-unknown-linux-gnu

  # Every other job runs stable, so the rust-version floor in Cargo.toml needs
  # its own job. rust-toolchain.toml outranks a rustup override, so the
  # toolchain has to be named on the cargo invocation itself.
  msrv:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Rethunk-Tech/gh-actions/setup-rust@67ec8bd68343d915462729ad119c355740cf6205 # v1.22
        with:
          toolchain: "1.98"
      - run: cargo +1.98 check --locked --all-targets

  # AGENTS.md says tests/live_proc.rs must hold in a bare container: no
  # /etc/passwd entry for the uid it sees, no docker socket, no DRM, no
  # systemd cgroups, and a /proc holding one process rather than a machine's
  # worth. Every other job runs it where all of that exists, so the one
  # environment heft documents as supported was the one never exercised.
  # A static musl test binary keeps the container to the test rather than to
  # a toolchain, so the image needs nothing installed in it. live_proc then
  # spawns heft via CARGO_BIN_EXE_heft (an absolute host path), so that file
  # has to exist at the same path inside the container. A file bind-mount at a
  # dest Alpine does not have becomes a directory, which is why the parent
  # debug/ dir is what gets mounted.
  bare-container:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Rethunk-Tech/gh-actions/setup-rust@67ec8bd68343d915462729ad119c355740cf6205 # v1.22
        with:
          toolchain: stable
          targets: x86_64-unknown-linux-musl
      - run: |
          art=$(mktemp)
          cargo test --locked --target x86_64-unknown-linux-musl \
            --test live_proc --no-run --message-format=json > "$art"
          bin=$(jq -r 'select(.target.name == "live_proc" and .executable != null)
                          | .executable' "$art" | tail -n1)
          heft=$(jq -r 'select(.target.name == "heft" and .executable != null)
                          | .executable' "$art" | tail -n1)
          test -n "$bin" && test -f "$heft"
          docker run --rm --network none \
            -v "$bin:/live_proc:ro" \
            -v "$(dirname "$heft"):$(dirname "$heft"):ro" \
            alpine@sha256:294b683cb724975bec92580e1e685676bd4b50bda910ddb8c51d4cabeaec77e6 \
            /live_proc
