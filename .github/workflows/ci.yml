name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # master
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: cargo-bins/cargo-binstall@b874e25ea559687bec77e281e9b271aa1367b624 # v1.22.0
        with:
          version: "1.22.0"
      - run: cargo binstall --no-confirm cargo-deny cargo-machete
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - run: cargo deny --locked check
      - run: cargo machete

  # /proc and DRM fdinfo are architecture-neutral, so an x86 assumption is a
  # bug heft should not need an aarch64 runner to find. Check only: nothing
  # links, so no cross linker is required.
  cross-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # master
        with:
          toolchain: stable
          targets: aarch64-unknown-linux-gnu
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: aarch64
      - run: cargo check --locked --all-targets --target aarch64-unknown-linux-gnu

  # Cargo.toml declares rust-version = "1.98" and AGENTS.md leans on that floor
  # to keep the hand-rolled helpers, but every other job runs stable, so the
  # floor was asserted and never tested. rust-toolchain.toml outranks a rustup
  # override, so the toolchain has to be named on the cargo invocation itself.
  msrv:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # master
        with:
          toolchain: "1.98"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: msrv
      - run: cargo +1.98 check --locked --all-targets

  # AGENTS.md says tests/live_proc.rs must hold in a bare container: no
  # /etc/passwd entry for the uid it sees, no docker socket, no DRM, no
  # systemd cgroups, and a /proc holding one process rather than a machine's
  # worth. Every other job runs it where all of that exists, so the one
  # environment heft documents as supported was the one never exercised.
  # A static musl test binary keeps the container to the test rather than to
  # a toolchain, so the image needs nothing installed in it. live_proc then
  # spawns heft via CARGO_BIN_EXE_heft (an absolute host path), so that file
  # has to exist at the same path inside the container. A file bind-mount at a
  # dest Alpine does not have becomes a directory, which is why the parent
  # debug/ dir is what gets mounted.
  bare-container:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # master
        with:
          toolchain: stable
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: musl
      - run: |
          art=$(mktemp)
          cargo test --locked --target x86_64-unknown-linux-musl \
            --test live_proc --no-run --message-format=json > "$art"
          bin=$(jq -r 'select(.target.name == "live_proc" and .executable != null)
                          | .executable' "$art" | tail -n1)
          heft=$(jq -r 'select(.target.name == "heft" and .executable != null)
                          | .executable' "$art" | tail -n1)
          test -n "$bin" && test -f "$heft"
          docker run --rm --network none \
            -v "$bin:/live_proc:ro" \
            -v "$(dirname "$heft"):$(dirname "$heft"):ro" \
            alpine@sha256:28bd5fe8b56d1bd048e5babf5b10710ebe0bae67db86916198a6eec434943f8b \
            /live_proc
