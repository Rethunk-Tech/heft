name: release
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 30
    strategy:
      matrix:
        # musl is the portable artifact: heft only needs sysconf and geteuid
        # from libc and reads /etc/passwd itself, so a static build carries no
        # NSS dependency and runs on any glibc.
        #
        # Each target builds on its own architecture rather than cross-linking.
        # CI's cross-check job compiles aarch64 without a linker because it
        # never links; a release does, and a native runner is a smaller thing
        # to maintain than a cross toolchain. It also lets the smoke test below
        # actually run the binary it just built, which a cross build cannot.
        include:
          - target: x86_64-unknown-linux-gnu
            runs-on: ubuntu-latest
          - target: x86_64-unknown-linux-musl
            runs-on: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            runs-on: ubuntu-24.04-arm
          - target: aarch64-unknown-linux-musl
            runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # master
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ${{ matrix.target }}

      - name: Check the tag matches the crate version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          test "$TAG" = "v$version"

      # Uses [profile.release] from Cargo.toml (LTO, codegen-units = 1, strip,
      # panic = abort). Do not restate those here.
      - run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Stage the binary and its checksum
        run: |
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/heft" "dist/heft-${{ matrix.target }}"
          cd dist
          sha256sum "heft-${{ matrix.target }}" > "heft-${{ matrix.target }}.sha256"

      # build.rs writes completions and the man page under a hashed OUT_DIR.
      # They are arch-independent, so only one matrix leg stages them; two
      # would collide on the same filename when the artifacts are merged.
      - name: Stage completions and the man page
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: |
          # Newest, not first: rust-cache restores target/ between runs, so an
          # assets dir from an earlier build of an earlier tag survives and
          # `head -1` can hand back its stale completions and man page.
          #
          # Ranked by the man page's own mtime, not the directory's. A build
          # script rewriting these files in place does not touch the directory,
          # whose mtime only moves when an entry is added or removed — measured
          # locally at a directory an hour older than the file inside it.
          man=$(find "target/${{ matrix.target }}/release/build" -name heft.1 \
            -printf '%T@ %p\n' | sort -rn | head -1 | cut -d' ' -f2-)
          test -n "$man" || { echo "build.rs produced no man page"; exit 1; }
          assets=$(dirname "$man")
          # The invariant, without naming a flag that could be renamed: what
          # build.rs generated must postdate the flag definitions it read.
          test "$man" -nt src/cli.rs || {
            echo "generated assets predate src/cli.rs: $assets"; exit 1; }
          for f in heft.bash _heft heft.fish heft.1; do
            test -s "$assets/$f" || { echo "missing generated asset: $f"; exit 1; }
          done
          tar -czf dist/heft-completions-man.tar.gz -C "$assets" heft.bash _heft heft.fish heft.1
          cd dist
          sha256sum heft-completions-man.tar.gz > heft-completions-man.tar.gz.sha256

      # A release that ships a binary which cannot walk /proc is the failure
      # worth catching here, not at the first user download.
      - name: Smoke-test the binary
        run: |
          "./dist/heft-${{ matrix.target }}" --json --interval 0.1 > /tmp/heft.json
          test -s /tmp/heft.json

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: heft-${{ matrix.target }}
          path: dist/
          if-no-files-found: error
          retention-days: 1

  release:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Scoped to this job: the build compiles dependency build scripts and must
    # not hold a token that can write to the repository, nor one that can sign
    # in this repository's name.
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true

      - name: Verify the checksums survived the round trip
        working-directory: dist
        run: sha256sum -c ./*.sha256

      # Signs a statement that these exact digests came out of this workflow at
      # this commit, so `gh attestation verify` answers the question a
      # published .sha256 cannot: the checksum proves the download was not
      # corrupted, this proves who built it. Attests the binaries only — the
      # completions tarball is generated text, not an executable someone runs.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/heft-*-linux-*
            !dist/*.sha256

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          gh release create "$TAG" \
            --repo "$REPO" \
            --title "$TAG" \
            --verify-tag \
            --generate-notes \
            dist/*

  # The AUR packages can only be finalised after the release exists: their
  # checksums are of the assets the build job just published. So this refreshes
  # them from the release, commits the refresh back, and pushes it to the AUR.
  #
  # heft-git is not pushed here. Its pkgver comes from `git describe` at build
  # time, so a tag changes nothing in it.
  aur:
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      # main rather than the tag: this job commits the refreshed PKGBUILDs, and
      # a tag is not a branch to commit onto.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false

      # makepkg --printsrcinfo is Arch-only, and the runner is not Arch. The
      # image is used rather than a `container:` job because the archlinux
      # image ships no node, which every JavaScript action needs.
      - name: Refresh the PKGBUILDs for this tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          docker run --rm -e TAG -v "$PWD":/work -w /work archlinux:base-devel bash -c '
            set -e
            pacman -Sy --noconfirm --needed --quiet >/dev/null
            useradd -m builder
            chown -R builder /work/packaging
            su builder -c "packaging/aur/update.sh $TAG"
          '

      - name: Commit the refresh
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          git add packaging/aur
          # Nothing to say when a tag ships the same assets twice.
          git diff --cached --quiet && exit 0
          git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -m "chore(aur): heft ${TAG#v}"
          git push "https://x-access-token:$GH_TOKEN@github.com/$REPO" HEAD:main

      # Skipped rather than failed without the secret: the refresh above is
      # still worth having, and the maintainer can push by hand.
      - name: Push to the AUR
        env:
          AUR_SSH_KEY: ${{ secrets.AUR_SSH_KEY }}
          TAG: ${{ github.ref_name }}
        run: |
          if [ -z "$AUR_SSH_KEY" ]; then
            echo "::notice::no AUR_SSH_KEY secret, skipping the AUR push"
            exit 0
          fi
          mkdir -p ~/.ssh
          printf '%s\n' "$AUR_SSH_KEY" > ~/.ssh/aur
          chmod 600 ~/.ssh/aur
          ssh-keyscan aur.archlinux.org >> ~/.ssh/known_hosts
          export GIT_SSH_COMMAND='ssh -i ~/.ssh/aur -o IdentitiesOnly=yes'
          for pkg in heft heft-bin; do
            git clone "ssh://aur@aur.archlinux.org/$pkg.git" "$RUNNER_TEMP/$pkg"
            cp packaging/aur/LICENSE "packaging/aur/$pkg/PKGBUILD" "packaging/aur/$pkg/.SRCINFO" "$RUNNER_TEMP/$pkg/"
            git -C "$RUNNER_TEMP/$pkg" add PKGBUILD .SRCINFO LICENSE
            git -C "$RUNNER_TEMP/$pkg" diff --cached --quiet && continue
            git -C "$RUNNER_TEMP/$pkg" \
              -c user.name='Damon Blais' -c user.email='damon.blais@gmail.com' \
              commit -m "heft ${TAG#v}"
            git -C "$RUNNER_TEMP/$pkg" push
          done
