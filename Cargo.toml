[package]
name = "heft"
version = "0.6.2"
edition = "2024"
rust-version = "1.98"
license = "Apache-2.0"
publish = false
description = "Read-only Linux TUI for application-weight process accounting"
repository = "https://github.com/Rethunk-Tech/heft"
readme = "README.md"

[dependencies]
clap = { version = "4", default-features = false, features = [
  "std",
  "derive",
  "help",
  "usage",
  "error-context",
  "suggestions",
] }
crossterm = "0.29"
libc = "0.2"
regex-lite = "0.1"
ratatui = { version = "0.30", default-features = false, features = [
  "crossterm",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
unicode-truncate = "2"
unicode-width = "0.2"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"

[build-dependencies]
clap = { version = "4", default-features = false, features = [
  "std",
  "derive",
  "help",
  "usage",
  "error-context",
  "suggestions",
] }
clap_complete = "4.6.9"
clap_mangen = "0.3.3"

# Clippy runs at its default level in CI and the pre-commit hook. The wider
# groups were measured rather than assumed: pedantic + nursery + cargo report
# 216 warnings, and 87 of those are one nursery lint, `redundant_pub_crate`,
# against a visibility style this crate keeps on purpose. The rest is mostly
# `doc_markdown`, `too_many_lines` over render functions that are deliberately
# one piece, and casts in pixel and column arithmetic that are bounded by the
# code around them. Adopting the group wholesale would be a mechanical rewrite
# buying style, so it is refused -- see AGENTS.md.
#
# These four are the part that was worth keeping. Each found something real
# here (an `&mut self` that never mutated, a clone assigned over a live
# String, a temporary formatted once a frame), each is now at zero, and
# denying them is what stops that coming back.
[lints.clippy]
needless_pass_by_ref_mut = "deny"
assigning_clones = "deny"
redundant_clone = "deny"
format_push_string = "deny"
# Pedantic and nursery wholesale is 397 warnings, 174 of them one lint
# objecting to a deliberate visibility style. These are the subset that found
# something: the four cast lints are denied so every widening carries an
# #[expect] naming the bound that makes it safe, rather than a prose claim.
cast_precision_loss = "deny"
cast_possible_truncation = "deny"
cast_possible_wrap = "deny"
cast_sign_loss = "deny"
doc_markdown = "deny"
map_unwrap_or = "deny"
missing_const_for_fn = "deny"
use_self = "deny"
