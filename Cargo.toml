[package]
name = "heft"
version = "0.2.0"
edition = "2024"
rust-version = "1.98"
license = "Apache-2.0"
publish = false
description = "Read-only Linux TUI for application-weight process accounting"
repository = "https://github.com/Rethunk-Tech/heft"
readme = "README.md"

[dependencies]
clap = { version = "4", features = ["derive"] }
crossterm = "0.29"
libc = "0.2"
ratatui = { version = "0.30", default-features = false, features = [
  "crossterm",
  "layout-cache",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"

[build-dependencies]
clap = { version = "4", features = ["derive"] }
clap_complete = "4.6.9"
clap_mangen = "0.3.3"
