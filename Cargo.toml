[package]
name = "heft"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license-file = "LICENSE"
publish = false
description = "Read-only Linux TUI for application-weight process accounting"

[dependencies]
clap = { version = "4", features = ["derive"] }
crossterm = "0.29"
libc = "0.2"
ratatui = { version = "0.30", default-features = false, features = [
  "crossterm",
  "layout-cache",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
