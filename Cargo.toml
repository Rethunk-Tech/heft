[package]
name = "heft"
version = "0.10.0"
edition = "2024"
rust-version = "1.98"
license = "Apache-2.0"
publish = false
description = "Read-only Linux TUI for application-weight process accounting"
repository = "https://github.com/Rethunk-Tech/heft"
readme = "README.md"

[dependencies]
clap = { version = "4", default-features = false, features = [
  "std",
  "derive",
  "help",
  "usage",
  "error-context",
  "suggestions",
] }
crossterm = "0.29"
libc = "0.2"
regex-lite = "0.1"
ratatui = { version = "0.30", default-features = false, features = [
  "crossterm",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
unicode-truncate = "2"
unicode-width = "0.2"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"

[build-dependencies]
clap = { version = "4", default-features = false, features = [
  "std",
  "derive",
  "help",
  "usage",
  "error-context",
  "suggestions",
] }
clap_complete = "4.6.9"
clap_mangen = "0.3.3"

# Clippy runs at its default level in CI and the pre-commit hook, plus the
# denials below. The pedantic, nursery and cargo groups are measured and
# refused wholesale: most of what they report is `redundant_pub_crate` against
# a visibility style this crate keeps on purpose, and `too_many_lines` over
# render functions that are one piece by design. The measurement is in
# AGENTS.md, Gates.
#
# Each lint listed here found something real and is at zero, so denying it
# costs nothing and stops it coming back. The four cast lints make every cast
# carry an #[expect(..., reason = ...)] naming the bound that makes it safe,
# which the compiler checks is still firing.
[lints.clippy]
needless_pass_by_ref_mut = "deny"
assigning_clones = "deny"
redundant_clone = "deny"
format_push_string = "deny"
cast_precision_loss = "deny"
cast_possible_truncation = "deny"
cast_possible_wrap = "deny"
cast_sign_loss = "deny"
doc_markdown = "deny"
map_unwrap_or = "deny"
missing_const_for_fn = "deny"
use_self = "deny"
