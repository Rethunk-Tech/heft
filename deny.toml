# cargo-deny: advisories, licenses, bans, sources.
# https://embarkstudios.github.io/cargo-deny/

[graph]
# Linux-only product; other triples would surface windows/apple crates we never ship.
targets = ["x86_64-unknown-linux-gnu", "aarch64-unknown-linux-gnu"]
all-features = true

[advisories]
yanked = "deny"
# Direct deps only: a leaf crate going quiet should not fail the gate.
unmaintained = "workspace"
unsound = "all"
ignore = []

[licenses]
confidence-threshold = 0.93
# Permissive-only allow list. The binary itself is All Rights Reserved (see LICENSE);
# unpublished workspace members are skipped below rather than given a fake SPDX.
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSL-1.0",
  "MIT",
  "Unicode-3.0",
  "Unlicense",
  "Zlib",
]
unused-allowed-license = "deny"

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
deny = [
  { crate = "openssl", use-instead = "rustls" },
  { crate = "openssl-sys", use-instead = "rustls" },
  { crate = "git2", use-instead = "gix" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
