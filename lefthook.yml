# Git hooks, managed by lefthook.
#
# Pre-commit is fmt + clippy on the touched files (the cheap local gates).
# cargo fmt --check does not rewrite the tree.
#
# Pre-push is bare `gate`, which detects this project's gates rather than
# listing them here: build, clippy, fmt, test, deny, machete and actionlint.
# The flavours this project runs -- --locked everywhere, -D warnings on clippy
# -- live in .gate.toml, so the hook and `gate --list` cannot drift apart.
#
# Enable with `lefthook install`. Hooks are not committed by git, so this file
# is the decision; running that command is what applies it.

pre-commit:
  parallel: true
  jobs:
    - name: fmt
      glob: "*.{rs,toml}"
      run: cargo fmt --check
    - name: clippy
      glob: "*.{rs,toml}"
      run: cargo clippy --locked --all-targets -- -D warnings

pre-push:
  jobs:
    - name: gates
      run: gate
